name: Pakete prüfen
on: [push, pull_request]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format der Pakete prüfen
        run: python3 tools/check_format.py packs/*/pack.json
      # The app's catalog reads index.json. After a change on main it is rebuilt and committed here,
      # so contributors never edit it by hand.
      - name: Katalog (index.json) aktualisieren
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 tools/make_index.py > index.json
          if ! git diff --quiet -- index.json || ! git ls-files --error-unmatch index.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.json
            git commit -m "Katalog aktualisiert"
            git push
          fi
